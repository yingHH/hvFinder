# Conda environment for building the hvFinder **Windows** client.
#
# Must run on a machine matching the conda platform (win-64); PyInstaller cannot
# cross-compile: an environment created on Linux/macOS cannot produce a usable exe.
#
# Create:
#   conda env create -f build/environment-win.yml
# Update:
#   conda env update -f build/environment-win.yml --prune
# Write an explicit lock file (recommended, archive it with the release):
#   conda list -n hvFinder --explicit > build/conda-explicit-win.txt

name: hvFinder
channels:
  - conda-forge
dependencies:
  - python=3.9          # matches the version stated in the README
  - pip
  - pyinstaller>=6.0
  - pyinstaller-hooks-contrib
  - pyside6>=6.5
  - paramiko
  - pyyaml
  - cryptography
